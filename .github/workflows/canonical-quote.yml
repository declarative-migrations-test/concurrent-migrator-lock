name: Canonical quote concurrent migrations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-quote-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: "postgres:${{ matrix.postgres }}"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: quote-concurrency
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out concurrency harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Check out exact Canonical quote source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-api-server.rs
          ref: 7987c05944df5c03ff2fcbeeedf2c8e79f973d75
          path: canonical-api
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source and distinct migration pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-repository.py
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          contract = json.loads(Path('canonical-quote-source.json').read_text())
          source = Path('canonical-api')
          observed_source = subprocess.check_output(
              ['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True
          ).strip()
          observed_certification_dpm = subprocess.check_output(
              [
                  'git',
                  '-C',
                  'vendor/declarative-postgres-migrate.rs',
                  'rev-parse',
                  'HEAD',
              ],
              text=True,
          ).strip()
          assert observed_source == contract['sourceCommit']
          assert observed_certification_dpm == contract['certificationDpmCommit']
          assert hashlib.sha256(
              (source / 'db/schema.sql').read_bytes()
          ).hexdigest() == contract['schemaSha256']
          namespace = json.loads((source / 'db/namespace.json').read_text())
          assert namespace['namespaceId'] == 'canonical_cloud__quote'
          assert namespace['database']['minimumMajorVersion'] == 17
          assert namespace['declarativeMigration']['source'] == 'db/schema.sql'
          assert namespace['declarativeMigration']['bootstrap'] == 'db/bootstrap.sql'
          assert namespace['declarativeMigration']['grants'] == 'db/grants.sql'
          assert namespace['declarativeMigration']['revision'] == contract['dpmCommit']
          assert namespace['declarativeMigration']['sourceSha256'] == contract['schemaSha256']
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.1"

      - name: Cache pinned dpm build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: vendor/declarative-postgres-migrate.rs -> target
          key: canonical-quote-concurrency-pg${{ matrix.postgres }}

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build pinned dpm
        id: dpm
        shell: bash
        run: echo "path=$(scripts/build-dpm.sh)" >> "$GITHUB_OUTPUT"

      - name: Stress namespace deployment and policy-repair races
        env:
          CANONICAL_API_DIR: ${{ github.workspace }}/canonical-api
          CONTENDERS: '8'
          DPM_BIN: ${{ steps.dpm.outputs.path }}
          POSTGRES_ADMIN_URL: postgres://postgres:quote-concurrency@localhost:5432/postgres
          POSTGRES_MAJOR: ${{ matrix.postgres }}
          TEST_ROLE_PASSWORD: quote-concurrency
        run: bash scripts/test-canonical-quote-concurrency.sh

      - name: Ensure bounded failure evidence exists
        if: always()
        shell: bash
        env:
          EVIDENCE_DIR: artifacts/canonical-quote-concurrency/pg${{ matrix.postgres }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if ! find "$EVIDENCE_DIR" -type f -print -quit | grep -q .; then
            printf '%s\n' \
              'result=failed' \
              'classification=harness-or-product-regression' \
              "source_commit=$(python3 -c 'import json; print(json.load(open("canonical-quote-source.json"))["certificationDpmCommit"])')" \
              "workflow_commit=${GITHUB_SHA}" \
              > "$EVIDENCE_DIR/early-failure.txt"
          fi

      - name: Upload bounded contender and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-quote-concurrency-pg${{ matrix.postgres }}
          path: artifacts/canonical-quote-concurrency/pg${{ matrix.postgres }}
          retention-days: 14
          if-no-files-found: error
